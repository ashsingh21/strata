[workspace]
resolver = "2"
members = ["engine", "shared", "ui"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1

# The audio path (engine DSP, Carve voices, shared playback) runs in a
# real-time callback: unoptimized, the House demo's drop overran its
# deadline and crackled in dev builds. Optimize just these (and every
# dependency) even in dev; the UI crate stays fast to rebuild.
[profile.dev.package.engine]
opt-level = 3

[profile.dev.package.shared]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# Windows: winit's windows-sys import library, minus its icu.dll entries.
# Skia bundles its own ICU; with Windows' ICU declared too, the linker sent
# some of Skia's ICU calls to Windows' icu.dll (a different ICU version -
# and missing under Wine). See vendor/windows_x86_64_msvc-0.52.6/README-shor.md.
[patch.crates-io]
windows_x86_64_msvc = { path = "vendor/windows_x86_64_msvc-0.52.6" }
