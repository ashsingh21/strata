[workspace]
resolver = "2"
members = ["engine", "shared", "ui"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1

# The audio path (engine DSP, Carve voices, shared playback) runs in a
# real-time callback: unoptimized, the House demo's drop overran its
# deadline and crackled in dev builds. Optimize just these (and every
# dependency) even in dev; the UI crate stays fast to rebuild.
[profile.dev.package.engine]
opt-level = 3

[profile.dev.package.shared]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# Vizia with a user zoom (vendor/vizia_core-0.4.0/SHOR-PATCH.md): the whole
# UI scaled on top of the screen's own scale.
[patch.crates-io]
vizia_core = { path = "vendor/vizia_core-0.4.0" }
