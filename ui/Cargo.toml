[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
shared = { path = "../shared" }
engine = { path = "../engine" }
vizia = "0.4.0"
rtrb = "0.4.0"
hound = "3.5.1"
serde_json = "1"
tracing = "0.1"
# Log lines with a target and level, filtered by RUST_LOG (see logging.rs).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
# Timestamps in the log and crash reports (see logging.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
midir = "0.11.0"

# Copying stderr into the log file (see logging.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde_json = "1"

# Native dialogs on macOS/Windows (Linux uses zenity - see ui/src/dialogs.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17.2"
