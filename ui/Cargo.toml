[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
shared = { path = "../shared" }
engine = { path = "../engine" }
rtrb = "0.4.0"
hound = "3.5.1"
serde_json = "1"

[build-dependencies]
serde_json = "1"

# Everywhere but Windows, Vizia as it comes. On Windows without its
# screen-reader support (accesskit): that pulls in the windows crate's
# declarations of Windows' own ICU, which clash with the copy of ICU Skia
# bundles - the two can't be linked into one program.
[target.'cfg(not(windows))'.dependencies]
vizia = "0.4.0"

[target.'cfg(windows)'.dependencies]
vizia = { version = "0.4.0", default-features = false, features = ["winit", "clipboard", "markdown"] }

# Native dialogs on macOS/Windows (Linux uses zenity - see ui/src/dialogs.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17.2"
