[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
shared = { path = "../shared" }
engine = { path = "../engine" }
vizia = "0.4.0"
rtrb = "0.4.0"
hound = "3.5.1"
serde_json = "1"

[build-dependencies]
serde_json = "1"

# Native dialogs on macOS/Windows (Linux uses zenity - see ui/src/dialogs.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17.2"
